# ShopEngine Messages
# Supports MiniMessage formatting: https://docs.advntr.dev/minimessage/format.html

# Core Messages
prefix: "<dark_gray>[<gradient:#00ff00:#00ffff>ShopEngine</gradient>]</dark_gray>"
no-permission: "<red>You don't have permission to use this!"
player-only: "<red>This command can only be used by players!"

# Economy Messages
economy:
  not-enough-money: "<red>You don't have enough money! <gray>(Need: <gold>$<amount></gold>)"
  balance: "<green>Your balance: <gold>$<balance>"
  transaction-failed: "<red>Transaction failed! Please contact an admin."

# Shop Messages
shop:
  cannot-buy: "<red>You cannot buy this item!"
  cannot-sell: "<red>You cannot sell this item!"
  not-enough-stock: "<red>Not enough stock! <gray>(Available: <yellow><stock></yellow>)"
  inventory-full: "<red>Your inventory is full!"
  not-enough-items: "<red>You don't have enough items! <gray>(You have: <white><amount></white>)"
  purchase-success: "<green>✓ Purchased <white><amount>x <item> <green>for <gold>$<price>!"
  sell-success: "<green>✓ Sold <white><amount>x <item> <green>for <gold>$<price>!"
  search-prompt: "<yellow>Type your search term in chat and press ENTER!"
  search-cancel: "<gray>Type 'cancel' to exit search mode."
  search-cancelled: "<red>Search cancelled."
  search-starting: "<green>Searching for '<white><term></white>'..."
  search-no-results: "<red>No items found matching '<white><term></white>'!"

# Dynamic Pricing
dynamic-prices:
  high: "<gold>▲ Prices are high"
  low: "<aqua>▼ Prices are low"

# GUI Lore
gui:
  titles:
    main-shop: "<gradient:#00ff00:#00ffff>Shop</gradient>"
    section: "<section>"

  lore:
    click-to-view: "<gray>Click to view items!"
    your-balance: "<gray>Your balance: <gold>$<balance>"
    buy-price: "<green>Buy: <white>$<price>"
    sell-price: "<red>Sell: <white>$<price>"
    stock: "<gray>Stock: <yellow><current>"
    back-title: "<red>← Back"
    back-button: "<gray>Return to main menu"
    filler: "<gray>•"
    error-item: "<#FF0000><bold>CONFIG ERROR - Click for details"

  search:
    title: "<gradient:#00ff00:#00ffff>Search: '<term>'</gradient>"
    search-again: "<yellow>🔍 Search Again"
    search-lore: "<gray>Click to search for different items"
    close: "<red>Close Results"
    previous: "<yellow>← Previous Page"
    next: "<yellow>Next Page →"
    sign-title: "<gold>🔍 Search Shop"
    sign-lore: "<gray>Click to search across all sections"
    click-to-buy: "<green>Buy: <white>$<price>"
    click-to-sel: "<red>Sell: <white>$<price>"

    # Action lore
    left-click-buy: "<yellow>Left-Click <gray>to buy 1"
    right-click-sell: "<yellow>Right-Click <gray>to sell 1"
    shift-left-buy: "<yellow>Shift-Left <gray>to buy 64"
    shift-right-sell: "<yellow>Shift-Right <gray>to sell all"


  navigation:
     previous: "<yellow>← Previous Page"
     previous-lore: "<gray>Click to go to page <yellow><page>"
     next: "<yellow>Next Page →"
     next-lore: "<gray>Click to go to page <yellow><page>"
     page-info: "<gold>Page <yellow><current> <gold>of <yellow><total>"
     no-previous: "<gray>← No Previous Page"
     no-next: "<gray>No Next Page →"

# Command Messages
commands:
  # Reload messages
  reload-success: "<green>ShopEngine configuration reloaded!"
  reload-config: "<green>Configuration reloaded!"
  reload-messages: "<green>Messages reloaded!"
  reload-sections: "<green>Sections reloaded!"
  reload-items: "<green>Items reloaded!"
  reload-unknown: "<red>Unknown reload target! Use: <white>all|config|messages|sections|items"

  # Reset price
  resetprice-success: "<green>Price multiplier reset for <white><item>!"
  resetprice-usage: "<red>Usage: /shop resetprice <item-key>"

  # Help
  help:
    header: "<gold>ShopEngine Commands:"
    shop: "<yellow>/shop <gray>- Open the shop"
    balance: "<yellow>/shop balance <gray>- Check your balance"
    reload: "<yellow>/shop reload <all|config|messages|sections|items> <gray>- Reload configuration"
    resetprice: "<yellow>/shop resetprice <item> <gray>- Reset dynamic price"
    help: "<yellow>/shop help <gray>- Show this help"
    history: "<yellow>/shop history <gray>- View your transaction history"
    search: "<yellow>/shop search <gray>- Search for items by name"

  # General
  unknown: "<red>Unknown subcommand! Use: <white>/shop help"

  history:
    usage: "<red>Usage: /shop history"
    no-data: "<gray>No transaction history found!"
    no-permission: "<red>You don't have permission to view transaction history!"
