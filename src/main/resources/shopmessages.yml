# ShopEngine Messages
# MiniMessage formatting: https://docs.advntr.dev/minimessage/format.html

# Core
prefix: "<gray>[<gradient:#00F58C:#00E0FF>ShopEngine</gradient>]</gray>"
no-permission: "<#FF5555>⛔ You don’t have permission to perform this action."
player-only: "<#FF5555>⛔ This command can only be executed by players."

# Economy
economy:
  not-enough-money: "<#FF5555>❌ Insufficient funds! <gray>(Need: <#FFD36B>$<amount></#FFD36B>)"
  balance: "<#6BFF92>💰 Balance: <#FFD36B>$<balance>"
  transaction-failed: "<#FF5555>⚠ Transaction failed — contact an administrator."

# Shop
shop:
  cannot-buy: "<#FF5555>❌ You can’t purchase this item."
  cannot-sell: "<#FF5555>❌ You can’t sell this item."
  not-enough-stock: "<#FF5555>⚠ Not enough stock! <gray>(Available: <#FFEA52><current></#FFEA52>)"
  inventory-full: "<#FF5555>⚠ Your inventory is full."
  not-enough-items: "<#FF5555>⚠ You don’t have enough items. <gray>(You have: <white><amount></white>)"
  purchase-success: "<#6BFF92>✅ Purchased <white><amount>x <item></white> for <#FFD36B>$<price></#FFD36B>!"
  sell-success: "<#6BFF92>✅ Sold <white><amount>x <item></white> for <#FFD36B>$<price></#FFD36B>!"
  search-prompt: "<#FFD36B>🔎 Type your search term and press ENTER."
  search-cancel: "<gray>Type '<white>cancel</white>' to exit search mode."
  search-cancelled: "<#FF5555>❌ Search cancelled."
  search-starting: "<#6BFF92>🔎 Searching for '<white><term></white>'..."
  search-no-results: "<#FF5555>❌ No items found matching '<white><term></white>'."

# Dynamic Pricing
dynamic-prices:
  high: "<#FFD36B>▲ Prices are currently above average."
  low: "<#00D9FF>▼ Prices are currently below average."

# GUI Lore
gui:
  titles:
    main-shop: "<gradient:#00F58C:#00E0FF>Shop</gradient>"
    section: "<section>"

  lore:
    click-to-view: "<gray>▶ Click to browse."
    your-balance: "<gray>Balance: <#FFD36B>$<balance>"
    buy-price: "<#6BFF92>Buy: <white>$<price>"
    sell-price: "<#FF6B6B>Sell: <white>$<price>"
    stock: "<gray>Stock: <#FFEA52><current>"
    back-title: "<#FF5555>← Back"
    back-button: "<gray>Return to main menu."
    filler: "<gray>•"
    left-click-buy: "<#FFD36B>• Left-Click <gray>→ Buy 1"
    right-click-sell: "<#FFD36B>• Right-Click <gray>→ Sell 1"
    shift-left-buy: "<#FFD36B>• Shift-Left <gray>→ Buy 64"
    shift-right-sell: "<#FFD36B>• Shift-Right <gray>→ Sell All"

  search:
    title: "<gradient:#00F58C:#00E0FF>Search: '<term>'</gradient>"
    search-again: "<#FFD36B>🔎 New Search"
    search-lore: "<gray>Click to search for different items."
    close: "<#FF5555>✕ Close Results"
    previous: "<#FFD36B>← Previous Page"
    next: "<#FFD36B>Next Page →"
    sign-title: "<#FFD36B>🔎 Search Shop"
    sign-lore: "<gray>Search across all categories."
    click-to-buy: "<#6BFF92>Buy: <white>$<price>"
    click-to-sel: "<#FF6B6B>Sell: <white>$<price>"

    left-click-buy: "<#FFD36B>• Left-Click <gray>→ Buy 1"
    right-click-sell: "<#FFD36B>• Right-Click <gray>→ Sell 1"
    shift-left-buy: "<#FFD36B>• Shift-Left <gray>→ Buy 64"
    shift-right-sell: "<#FFD36B>• Shift-Right <gray>→ Sell All"

  navigation:
    previous: "<#FFD36B>← Previous Page"
    previous-lore: "<gray>Go to page <#FFEA52><page>"
    next: "<#FFD36B>Next Page →"
    next-lore: "<gray>Go to page <#FFEA52><page>"
    page-info: "<#FFD36B>Page <#FFEA52><current> <#FFD36B>of <#FFEA52><total>"
    no-previous: "<gray>← No previous page"
    no-next: "<gray>No next page →"

  history:
    title: "<gradient:#00F58C:#00E0FF>Transaction History</gradient>"
    no-transactions: "<#FF5555>❌ No transactions found."
    previous-page: "<#FFD36B>← Previous Page"
    next-page: "<#FFD36B>Next Page →"
    page-info: "<gray>Page <#FFEA52><current></gray>/<#FFEA52><total>"
    close: "<#FF5555>✕ Close"
    close-lore: "<gray>Return to shop."
    statistics: "<#FFD36B><bold>Statistics</bold>"
    recent-activity: "<gray>Recent activity"
    total-transactions: "<gray>Total: <#FFEA52><count>"
    purchases-count: "<#6BFF92>✓ Purchases: <#FFEA52><count>"
    sales-count: "<#FF6B6B>✗ Sales: <#FFEA52><count>"

# Commands
commands:
  reload-success: "<#6BFF92>✅ ShopEngine configuration reloaded."
  reload-config: "<#6BFF92>Config reloaded."
  reload-messages: "<#6BFF92>Messages reloaded."
  reload-sections: "<#6BFF92>Sections reloaded."
  reload-items: "<#6BFF92>Items reloaded."
  reload-unknown: "<#FF5555>⚠ Unknown target. Use: <white>all | config | messages | sections | items"

  resetprice-success: "<#6BFF92>🔄 Dynamic price reset for <white><item></white>."
  resetprice-usage: "<#FF5555>⚠ Usage: /shop resetprice <item-key>"

  help:
    header: "<#FFD36B><bold>ShopEngine Commands</bold>"
    shop: "<#FFD36B>/shop <gray>→ Open shop."
    balance: "<#FFD36B>/shop balance <gray>→ View balance."
    reload: "<#FFD36B>/shop reload <all|config|messages|sections|items> <gray>→ Reload config."
    resetprice: "<#FFD36B>/shop resetprice <item> <gray>→ Reset price."
    help: "<#FFD36B>/shop help <gray>→ Show help."
    history: "<#FFD36B>/shop history <gray>→ View transaction history."
    search: "<#FFD36B>/shop search <gray>→ Search items."

  unknown: "<#FF5555>⚠ Unknown command. Use: <white>/shop help</white>."

  history:
    usage: "<#FF5555>⚠ Usage: /shop history"
    no-data: "<gray>No transaction history found."
    no-permission: "<#FF5555>⛔ You don’t have permission to view history."
