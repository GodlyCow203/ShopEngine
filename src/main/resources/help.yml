# ===================================================================
# ShopEngine - Complete Configuration Guide
# ===================================================================
# This file explains every configuration option in detail
# Placeholders: <value> = replace with your value (without brackets)

# ===================================================================
# 1. SHOP SECTIONS
# ===================================================================

# Shop sections are categories like "Blocks", "Food", etc.
# Location: plugins/ShopEngine/sections/<name>.yml

section_example:
  display-name: "<green>My Section"
  icon: "DIAMOND"  # Material name from https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
  slot: 10  # Slot in GUI (0-53)
  page: 1   # Page number (1 = first page, 2 = second page, etc.)

# === SECTION KEY EXPLANATIONS ===
# display-name: The name shown in the GUI. Supports MiniMessage formatting (colors, gradients)
# icon: The item material displayed as the section icon
# slot: Inventory slot position (0-53). First row = 0-8, second row = 9-17, etc.
# page: Which page this section appears on. Use pages when you have too many sections

# === SECTION EXAMPLES ===

# Example 1: Basic Block Section (appears on page 1)
blocks:
  display-name: "<#8B4513>Blocks"
  icon: "STONEBRICKS"
  slot: 10
  page: 1

# Example 2: Advanced Items (appears on page 2)
advanced:
  display-name: "<gradient:#ff0000:#ffff00>Legendary Items"
  icon: "NETHER_STAR"
  slot: 15
  page: 2

# ===================================================================
# 2. SHOP ITEMS
# ===================================================================

# Shop items are the actual items players can buy/sell
# Location: plugins/ShopEngine/items/<name>.yml

item_example:
  material: "DIAMOND"
  display-name: "<blue>Shiny Diamond"  # Optional, if empty uses material name
  slot: 20
  page: 1
  amount: 1
  buy-price: 100.0  # Set to -1 to disable buying
  sell-price: 50.0   # Set to -1 to disable selling
  stock: 10          # Set to -1 for unlimited stock
  custom-model-data: -1  # Optional: Set to number > 0 for custom textures
  lore:
    - "<gray>This is a special diamond"
    - "<yellow>Very valuable!"

# === ITEM KEY EXPLANATIONS ===
# material: Bukkit Material enum (required) - https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
# display-name: Custom display name. If empty or missing, uses formatted material name
# slot: Position in section GUI (0-53, but stay away from navigation slots 45-53)
# page: Which page this item appears on (1-based)
# amount: How many items per transaction
# buy-price: Price to buy one item (-1 = cannot buy)
# sell-price: Price when selling one item (-1 = cannot sell)
# stock: Max initial stock (-1 = unlimited). When players sell, stock increases. When they buy, it decreases
# custom-model-data: Resource pack model ID (-1 = none, any positive number = custom model)
# lore: List of lore lines. Supports MiniMessage formatting

# === ITEM EXAMPLES ===

# Example 1: Basic buy-only item
dirt:
  material: "DIRT"
  display-name: "Dirt Block"
  slot: 10
  page: 1
  amount: 64
  buy-price: 10.0
  sell-price: -1  # Cannot sell
  stock: -1       # Unlimited
  lore: []

# Example 2: Sell-only item
cobblestone:
  material: "COBBLESTONE"
  display-name: "<gray>Cobblestone"
  slot: 11
  page: 1
  amount: 1
  buy-price: -1    # Cannot buy
  sell-price: 0.5
  stock: -1        # Unlimited
  lore:
    - "<gray>Just cobblestone..."

# Example 3: Limited stock rare item
dragon_egg:
  material: "DRAGON_EGG"
  display-name: "<gradient:#ff00ff:#ffff00>Dragon Egg"
  slot: 22
  page: 1
  amount: 1
  buy-price: 100000.0
  sell-price: 50000.0
  stock: 1         # Only 1 available until someone sells it back
  custom-model-data: 1
  lore:
    - "<red>Extremely rare!"
    - "<gray>Only one available"

# Example 4: Multi-page shop item
coal_page2:
  material: "COAL"
  display-name: "Coal (Page 2)"
  slot: 10
  page: 2          # Appears on page 2
  amount: 32
  buy-price: 50.0
  sell-price: 25.0
  stock: 100

# ===================================================================
# 3. DYNAMIC PRICING
# ===================================================================

# Dynamic pricing adjusts prices based on supply/demand
# Location: plugins/ShopEngine/config.yml

dynamic-pricing:
  enabled: true
  daily-fluctuation-percent: 5.0  # How much price changes per transaction (percentage)
  save-interval-minutes: 10       # How often to save prices to disk

# === HOW IT WORKS ===
# - When a player BUYS an item, the price INCREASES (more demand)
# - When a player SELLS an item, the price DECREASES (more supply)
# - Price multiplier is limited between 0.1x and 3.0x original price

# === EXAMPLE SCENARIO ===
# 1. Diamond has buy-price: 100.0
# 2. Player buys 10 diamonds → price increases by 5% × 10 = 50% increase
# 3. New price = 100 × 1.5 = 150.0
# 4. Later, players sell diamonds → price decreases back toward 100.0

