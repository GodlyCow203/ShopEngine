# ===================================================================
# 5. COMMAND REFERENCE
# ===================================================================

# /shop - Opens the shop GUI
# /shopadmin reload - Reloads all configs
# /shopadmin resetprices - Resets all dynamic prices to 1.0x

# ===================================================================
# 6. SETUP GUIDE
# ===================================================================

# STEP 1: Create sections
#   - Go to plugins/ShopEngine/sections/
#   - Create .yml files (e.g., blocks.yml, weapons.yml)
#   - Each file = one section/category

# STEP 2: Add items to sections
#   - Go to plugins/ShopEngine/items/
#   - Create .yml files with the SAME name as your section (blocks.yml, weapons.yml)
#   - Each key under the file is one item

# STEP 3: Configure economy
#   - Install Vault + an economy plugin (EssentialsX, CMI, etc.)
#   - No config needed - ShopEngine auto-detects Vault

# STEP 4: Start server and test!

# ===================================================================
# 7. TROUBLESHOOTING
# ===================================================================

# Problem: Items not showing in GUI
# Solution: Check that slot and page values are correct (0-53, page 1 or 2)
#           Make sure item .yml filename matches section .yml filename

# Problem: Prices not changing dynamically
# Solution: Ensure dynamic-pricing.enabled: true in config.yml
#           Check that you're using the latest plugin version

# Problem: Stock shows -1 (unlimited) when you set a number
# Solution: Check your .yml file format - stock should be unquoted number (10, not "10")
#           Run /shopadmin reload after changes

# Problem: Can't buy/sell items
# Solution: Check buy-price and sell-price are not -1 (if they're -1, that action is disabled)
#           Check if stock is empty (> 0 means limited stock, -1 = unlimited)

# Problem: Custom textures not working
# Solution: Ensure custom-model-data is a positive number (> 0)
#           Your resource pack must have the model at that ID

# Problem: Messages not formatting correctly
# Solution: Wrap messages in quotes if they contain ':' or special characters
#           Use valid MiniMessage format: https://docs.advntr.dev/minimessage/format.html

# ===================================================================
# 8. MINIMESSAGE QUICK REFERENCE
# ===================================================================

# <red>, <green>, <blue>, <yellow>, etc. - Basic colors
# <#ff0000> - Hex color
# <bold>, <italic>, <underlined> - Text styles
# <gradient:#ff0000:#00ff00> - Gradient text
# <rainbow> - Rainbow effect (animated in-game)
# <reset> - Reset all formatting

# Example: "<gradient:#ff0000:#ffff00><bold>Legendary Sword<reset>"

# ===================================================================
# 9. BEST PRACTICES
# ===================================================================

# 1. Slot Planning:
#    - Main shop GUI (sections): Use slots 0-44 only
#    - Section GUI (items): Use slots 0-44 only
#    - Navigation uses slots 45-53

# 2. Pricing Strategy:
#    - Set buy-price ~2x higher than sell-price for profit
#    - Use stock limits for rare items
#    - Enable dynamic pricing for high-volume items

# 3. Performance:
#    - Don't create more than 5-6 pages (performance impact)
#    - Use /shopengine reload after config changes (no restart needed)

# 4. Testing:
#    - Test with default configs first
#    - Use "/shopengine resetprices <item_key>" between tests to reset dynamic prices
#    - Check console for errors if GUI doesn't open

