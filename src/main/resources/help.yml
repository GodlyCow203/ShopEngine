# ===================================================================
# ⚠️ SECURITY WARNING - DO NOT EDIT THESE FILES MANUALLY
# ===================================================================

# DANGER: Never manually edit these files while the server is running!
# They contain live data and will be overwritten by the plugin.
# If you must edit them, stop the server first, make a backup, then edit.

protected-files:
  - "plugins/ShopEngine/playerdata/"      # Contains player transaction history
  - "plugins/ShopEngine/dynamic-prices.yml"  # Contains live price multipliers

# Why not to edit:
# playerdata/: Stores real-time player transaction data. Editing can corrupt player records
# dynamic-prices.yml: Updated every 10 minutes by the plugin. Manual changes will be lost

# If you need to reset prices: Use /shopengine resetprices (in-game command)
# If you need to edit player data: Stop server, backup, edit, restart
# ===================================================================